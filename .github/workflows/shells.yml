# Builds the Linux (AppImage, deb, rpm) and Android (APK) apps: the web app in a Tauri 2 shell.
# Runs by hand or when a version tag (v*) is pushed; tagged builds are attached to a GitHub release.
#
# Android signing: with the four secrets below the APK is signed with YOUR key, so every new build
# installs over the old one without uninstalling. If a secret is missing or the key does not work, the
# build does NOT fail: it warns (see the run summary) and signs with a throw-away debug key instead.
#   ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

name: Apps (Linux + Android)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf rpm file
      - name: Notes-folder tests
        working-directory: app/src-tauri
        run: rustc --edition 2021 --test src/vault.rs -o /tmp/vault_test && /tmp/vault_test
      - name: Self-signed certificate bridge tests
        working-directory: app/src-tauri
        run: cargo test --lib
      - name: Build
        working-directory: app
        run: |
          npm ci
          npx tauri build
      - uses: actions/upload-artifact@v7
        with:
          name: qalamark-linux
          path: |
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/rpm/*.rpm

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Prepare the Android project
        working-directory: app
        run: |
          npm ci
          # the runner image already ships the Android SDK (ANDROID_HOME)
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          export NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          npx tauri android init --ci
          # self-hosted servers are often plain http:// on the home network
          M=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          if grep -q usesCleartextTraffic "$M"; then
            # the template already declares it (as a placeholder): set it, never duplicate it
            sed -i -E 's|android:usesCleartextTraffic="[^"]*"|android:usesCleartextTraffic="true"|' "$M"
          else
            sed -i 's|<application|<application android:usesCleartextTraffic="true"|' "$M"
          fi
          # the keyboard resizes the page instead of covering it
          if grep -q windowSoftInputMode "$M"; then sed -i -E 's|android:windowSoftInputMode="[^"]*"|android:windowSoftInputMode="adjustResize"|' "$M"; else sed -i -E '0,/<activity/ s|<activity|<activity android:windowSoftInputMode="adjustResize"|' "$M"; fi
          # network access (a normal permission: Android never asks the user for it)
          grep -q 'android.permission.INTERNET' "$M" || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <application|' "$M"
          # Android 17 blocks apps from reaching the home network (192.168.x.x, *.lan...) until this is granted
          grep -q 'ACCESS_LOCAL_NETWORK' "$M" || sed -i 's|<application|<uses-permission android:name="android.permission.ACCESS_LOCAL_NETWORK" />\n    <application|' "$M"
          # Documents/Qalamark is outside the app's own space: Android asks for "all files" access (Settings, once)
          grep -q 'MANAGE_EXTERNAL_STORAGE' "$M" || sed -i 's|<application|<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n    <application|' "$M"
          # background running (a quiet notification) and the home-screen checklist widget
          for P in FOREGROUND_SERVICE FOREGROUND_SERVICE_SPECIAL_USE POST_NOTIFICATIONS RECEIVE_BOOT_COMPLETED USE_EXACT_ALARM; do
            grep -q "android.permission.$P" "$M" || sed -i "s|<application|<uses-permission android:name=\"android.permission.$P\" />\n    <application|" "$M"
          done
          python3 android-extras/patch_manifest.py "$M"
          python3 -c "import xml.dom.minidom,sys; xml.dom.minidom.parse(sys.argv[1])" "$M"
          # our launcher icon (the generated project starts with a placeholder one)
          cp -r src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/
          # the home-screen widget and the background service (native code and resources kept in android-extras)
          cp -r android-extras/res/. src-tauri/gen/android/app/src/main/res/
          cp android-extras/kotlin/*.kt src-tauri/gen/android/app/src/main/java/io/github/mmbesar/qalamark/
          # Android 15+ draws apps under the status and navigation bars: keep the page clear of them
          cat > src-tauri/gen/android/app/src/main/java/io/github/mmbesar/qalamark/MainActivity.kt <<'KOTLIN'
          package io.github.mmbesar.qalamark

          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.provider.Settings
          import android.graphics.Color
          import android.graphics.drawable.ColorDrawable
          import org.json.JSONObject
          import android.view.WindowManager
          import android.webkit.JavascriptInterface
          import android.webkit.WebView
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsControllerCompat
          import android.os.Bundle
          import android.view.View
          import androidx.core.view.ViewCompat
          import androidx.core.view.WindowInsetsCompat

          class MainActivity : TauriActivity() {
            // true while the page asked for full screen: the bars that come back with a swipe then float over the note
            // instead of pushing it down (which made the page jump, and jump back when they hid again)
            @Volatile private var hiding = false
            // true while "keep notes up to date in the background" is on: the page keeps running when the app is not in front
            @Volatile private var keep = false
            private var web: WebView? = null

            override fun onPause() {
              super.onPause()
              if (keep) {
                web?.onResume()
                web?.resumeTimers()
              }
            }

            // a tapped reminder: remember which note it was for and tell the page (now, or when it has loaded)
            override fun onNewIntent(intent: Intent) {
              super.onNewIntent(intent)
              intent.getStringExtra("qm_note")?.let { QmPrefs.openNote = it; QmPrefs.pokeOpen() }
            }

            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              intent?.getStringExtra("qm_note")?.let { QmPrefs.openNote = it }
              // asks once ("Allow Qalamark to access devices on your local network?"); without it a home server times out
              if (Build.VERSION.SDK_INT >= 37 && checkSelfPermission("android.permission.ACCESS_LOCAL_NETWORK") != PackageManager.PERMISSION_GRANTED) {
                requestPermissions(arrayOf("android.permission.ACCESS_LOCAL_NETWORK"), 7)
              } else {
                askForFiles()
              }
              // draw into the camera cut-out area too (otherwise a strip stays empty when the bars are hidden)
              if (Build.VERSION.SDK_INT >= 28) {
                window.attributes = window.attributes.apply {
                  layoutInDisplayCutoutMode = if (Build.VERSION.SDK_INT >= 30) WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS else WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                }
              }
              val root = findViewById<View>(android.R.id.content)
              ViewCompat.setOnApplyWindowInsetsListener(root) { v, insets ->
                // the camera cut-out is ignored at the top: with the bars hidden the text may use that space
                val bars = insets.getInsets(WindowInsetsCompat.Type.systemBars() or WindowInsetsCompat.Type.ime())
                val cut = insets.getInsets(WindowInsetsCompat.Type.displayCutout())
                if (hiding) {
                  // only the keyboard may still take room
                  val ime = insets.getInsets(WindowInsetsCompat.Type.ime())
                  v.setPadding(cut.left, 0, cut.right, ime.bottom)
                } else {
                  v.setPadding(maxOf(bars.left, cut.left), bars.top, maxOf(bars.right, cut.right), bars.bottom)
                }
                WindowInsetsCompat.CONSUMED
              }
            }

            // lets the page hide the status and navigation bars while reading (they come back with a swipe from the edge)
            override fun onWebViewCreate(webView: WebView) {
              web = webView
              QmPrefs.web = webView
              webView.addJavascriptInterface(object {
                // the home-screen widget: the page hands over its checklists and takes back what was ticked
                @JavascriptInterface
                fun widgetData(json: String) {
                  QmPrefs.setLists(applicationContext, json)
                  ChecklistWidget.refreshAll(applicationContext)
                }
                @JavascriptInterface
                fun takeTicks(): String = QmPrefs.takeTicks(applicationContext)
                @JavascriptInterface
                fun pushTick(json: String) {
                  QmPrefs.pushTick(applicationContext, json)
                }
                // keep running in the background with a quiet notification
                // a finished PDF goes to the phone's Downloads folder; the answer is the file name, or "" when it did not work
                @JavascriptInterface
                fun savePdf(b64: String, name: String): String {
                  return try {
                    val bytes = android.util.Base64.decode(b64, android.util.Base64.DEFAULT)
                    val clean = name.replace(Regex("[\\\\/:*?\"<>|]"), "-").ifBlank { "note" }.let { if (it.endsWith(".pdf", true)) it else "$it.pdf" }
                    if (Build.VERSION.SDK_INT >= 29) {
                      val cv = android.content.ContentValues().apply {
                        put(android.provider.MediaStore.Downloads.DISPLAY_NAME, clean)
                        put(android.provider.MediaStore.Downloads.MIME_TYPE, "application/pdf")
                        put(android.provider.MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS)
                      }
                      val uri = contentResolver.insert(android.provider.MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv) ?: return ""
                      contentResolver.openOutputStream(uri)?.use { it.write(bytes) } ?: return ""
                    } else {
                      val dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)
                      dir.mkdirs()
                      java.io.File(dir, clean).writeBytes(bytes)
                    }
                    clean
                  } catch (e: Exception) {
                    ""
                  }
                }
                // reminders: the coming ones go to the phone's alarm clock; a tapped notification names its note
                @JavascriptInterface
                fun scheduleReminders(json: String) {
                  Reminders.schedule(applicationContext, json)
                }
                @JavascriptInterface
                fun takeOpen(): String = QmPrefs.takeOpen()
                @JavascriptInterface
                fun keepAlive(on: Boolean) {
                  runOnUiThread {
                    keep = on
                    val svc = Intent(this@MainActivity, KeepAliveService::class.java)
                    try {
                      if (on) {
                        if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 8)
                        }
                        if (Build.VERSION.SDK_INT >= 26) startForegroundService(svc) else startService(svc)
                      } else {
                        stopService(svc)
                      }
                    } catch (e: Exception) {
                    }
                  }
                }
                @JavascriptInterface
                fun immersive(on: Boolean) {
                  runOnUiThread {
                    val c = WindowCompat.getInsetsController(window, window.decorView)
                    hiding = on
                    if (on) {
                      c.systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      c.hide(WindowInsetsCompat.Type.systemBars())
                    } else {
                      c.show(WindowInsetsCompat.Type.systemBars())
                    }
                    findViewById<View>(android.R.id.content).requestApplyInsets()
                  }
                }
                // Material You: the wallpaper-derived colours of the phone (Android 12 and later), as JSON
                @JavascriptInterface
                fun dynamicColors(): String {
                  if (Build.VERSION.SDK_INT < 31) return ""
                  val o = JSONObject()
                  for (n in listOf("accent1_100", "accent1_200", "accent1_600", "accent2_200", "accent2_600", "neutral1_10", "neutral1_50", "neutral1_100", "neutral1_200", "neutral1_800", "neutral1_900", "neutral1_1000", "neutral2_300", "neutral2_700")) {
                    try {
                      val id = android.R.color::class.java.getField("system_" + n).getInt(null)
                      o.put(n, String.format("#%06X", getColor(id) and 0xFFFFFF))
                    } catch (e: Exception) {
                    }
                  }
                  return o.toString()
                }
                // the colour behind the status and navigation bars follows the app's theme
                @JavascriptInterface
                fun bars(color: String, light: Boolean) {
                  runOnUiThread {
                    try {
                      val c = Color.parseColor(color)
                      window.setBackgroundDrawable(ColorDrawable(c))
                      findViewById<View>(android.R.id.content).setBackgroundColor(c)
                      val ctl = WindowCompat.getInsetsController(window, window.decorView)
                      ctl.isAppearanceLightStatusBars = light
                      ctl.isAppearanceLightNavigationBars = light
                    } catch (e: Exception) {
                    }
                  }
                }
              }, "QalamarkAndroid")
            }

            override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
              super.onRequestPermissionsResult(requestCode, permissions, grantResults)
              askForFiles()
            }

            // The notes live in Documents/Qalamark: that needs "all files" access, granted on a system screen.
            // Asked on the first launches only, so a person who says no is not nagged.
            private fun askForFiles() {
              if (Build.VERSION.SDK_INT < 30 || Environment.isExternalStorageManager()) return
              val prefs = getSharedPreferences("qalamark", MODE_PRIVATE)
              val n = prefs.getInt("filesAsked", 0)
              if (n >= 3) return
              prefs.edit().putInt("filesAsked", n + 1).apply()
              try {
                startActivity(Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION, Uri.parse("package:" + packageName)))
              } catch (e: Exception) {
                startActivity(Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION))
              }
            }
          }
          KOTLIN
      - name: Build the APK
        working-directory: app
        run: npx tauri android build --apk --target aarch64 --target armv7 --target x86_64
      - name: Sign the APKs
        working-directory: app
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          WHY=""
          KS=""
          # --- find out whether we can sign with the real key, and say why not if we cannot
          if [ -z "$KS_B64" ]; then WHY="the ANDROID_KEYSTORE_B64 secret is not set"
          elif [ -z "$KS_PASS" ]; then WHY="the ANDROID_KEYSTORE_PASSWORD secret is not set"
          elif [ -z "$KS_ALIAS" ]; then WHY="the ANDROID_KEY_ALIAS secret is not set"
          elif ! echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null || [ ! -s "$RUNNER_TEMP/release.jks" ]; then WHY="ANDROID_KEYSTORE_B64 is not valid base64 (encode the file with: base64 -w0 your.jks)"
          elif ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KS_PASS" -alias "$KS_ALIAS" > "$RUNNER_TEMP/kt.log" 2>&1; then WHY="the keystore did not open with that password/alias: $(tail -1 "$RUNNER_TEMP/kt.log")"
          else KS="$RUNNER_TEMP/release.jks"; fi
          if [ -n "$KS" ]; then
            ALIAS="$KS_ALIAS"; SPASS="$KS_PASS"; KPASS="${KEY_PASS:-$KS_PASS}"
            # a wrong key password is only found out when signing: test it on a tiny file first
            echo "signing with your key"
          else
            echo "::warning title=Android APK signed with a debug key::Not using your signing key because $WHY. The APK is signed with a temporary key: it installs, but cannot update an app signed with another key."
            { echo "### ⚠️ Android APK signed with a temporary debug key"; echo "Reason: $WHY"; echo; echo "Fix the secrets and run again; until then each build must be installed after uninstalling the previous one."; } >> "$GITHUB_STEP_SUMMARY"
            keytool -genkeypair -keystore "$RUNNER_TEMP/debug.jks" -alias debug -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Qalamark debug" > /dev/null
            KS="$RUNNER_TEMP/debug.jks"; ALIAS=debug; SPASS=android; KPASS=android
          fi
          sign() { # sign <in.apk> <out.apk>
            "$BT/zipalign" -f -p 4 "$1" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$ALIAS" --ks-pass "pass:$SPASS" --key-pass "pass:$KPASS" --out "$2" "$RUNNER_TEMP/aligned.apk"
          }
          APK=$(find src-tauri/gen/android -name '*universal*release*.apk' | head -1)
          [ -n "$APK" ] || { echo "no release APK found"; find src-tauri/gen/android -name '*.apk'; exit 1; }
          if ! sign "$APK" Qalamark.apk 2> "$RUNNER_TEMP/sign.log"; then
            WHY="the key password (ANDROID_KEY_PASSWORD) is wrong or the key cannot be used: $(tail -1 "$RUNNER_TEMP/sign.log")"
            echo "::warning title=Android APK signed with a debug key::$WHY"
            echo "### ⚠️ Signing with your key failed: $WHY" >> "$GITHUB_STEP_SUMMARY"
            keytool -genkeypair -keystore "$RUNNER_TEMP/debug.jks" -alias debug -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Qalamark debug" > /dev/null
            KS="$RUNNER_TEMP/debug.jks"; ALIAS=debug; SPASS=android; KPASS=android
            sign "$APK" Qalamark.apk
          fi
          "$BT/apksigner" verify --print-certs Qalamark.apk | head -3
      - uses: actions/upload-artifact@v7
        with:
          name: qalamark-android
          path: |
            app/Qalamark.apk
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
