# Puts a PREVIEW of the web app on GitHub Pages, so you can try the editor
# from a link. This is the "this device only" mode: notes stay in the browser.
# Your real notes live on your own Qalamark server (see the Docker image).
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.

name: Preview (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'packages/tables/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build
        working-directory: app
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist
      - id: deployment
        uses: actions/deploy-pages@v5
