# Checks and builds the web app (also the base of the Linux and Android apps),
# and tests it in a real browser against a real server.

name: App

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'packages/tables/**'
      - 'server/**'
      - '.github/workflows/app.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'packages/tables/**'
      - 'server/**'
      - '.github/workflows/app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Type check
        working-directory: app
        run: npm run check

      - name: Build
        working-directory: app
        run: npm run build

      - uses: actions/upload-artifact@v6
        with:
          name: web-app
          path: app/dist
          retention-days: 14

  browser:
    name: Browser test
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - uses: actions/download-artifact@v7
        with:
          name: web-app
          path: app/dist

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: server-${{ runner.os }}-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: server-${{ runner.os }}-

      - name: Build the server
        working-directory: server
        run: cargo build --locked

      - name: Install the test browser
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Browser test
        working-directory: e2e
        run: npm run test:browser
