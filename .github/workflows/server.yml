# Builds and tests the Rust server, then runs the end-to-end test:
# a real server with real co-editing clients (users, sharing, live sync, .md files).

name: Server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'e2e/**'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'e2e/**'
      - '.github/workflows/server.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # Keep downloaded Rust crates and build files between runs.
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: server-${{ runner.os }}-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: server-${{ runner.os }}-

      - name: Rust unit tests
        working-directory: server
        run: cargo test --locked

      - name: Build the server
        working-directory: server
        run: cargo build --locked

      - name: End-to-end test
        working-directory: e2e
        run: |
          npm ci
          # the editing tests import the editor's own commands, which need the app's CodeMirror packages
          (cd ../app && npm ci --ignore-scripts)
          npm test
